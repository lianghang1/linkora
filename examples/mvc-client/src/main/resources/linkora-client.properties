# 客户端装配配置（linkora-spring 的 LinkoraClientConfiguration，键与 Boot 版对齐）。
# JVM 参数 -Dlinkora.client.* 优先级更高，可覆盖本文件。
linkora.client.server-url=http://127.0.0.1:8081
linkora.client.client-id=demo-client
# SQLite 本地队列（WAL + synchronous=FULL）；换宿主业务库可自提供 @Primary ClientStore bean
linkora.client.db-path=linkora/linkora-mvc-client.db
# 认证（0.6.0）：token 模式——宿主登录体系下发的 token（静态演示）
linkora.client.auth-mode=token
linkora.client.auth-token=grp-demo-client-2026
# 传输加密（0.6.0 默认开启；key 必须与线上服务端一致）
linkora.payload-cipher-key=Qr1J5BCqFYkIlxfELSx6xYoZZ5YxYEZyWHZrBOJT83M=
