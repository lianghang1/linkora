# 客户端装配配置（linkora-spring 的 LinkoraClientConfiguration，键与 Boot 版对齐）。
# JVM 参数 -Dlinkora.client.* 优先级更高，可覆盖本文件。
linkora.client.server-url=http://127.0.0.1:8081
linkora.client.client-id=demo-client
# SQLite 本地队列（WAL + synchronous=FULL）；换宿主业务库可自提供 @Primary ClientStore bean
linkora.client.db-path=data/linkora-mvc-client.db
