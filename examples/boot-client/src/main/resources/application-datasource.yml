# datasource 模式：客户端本地队列落在宿主 DataSource，与业务表同库同事务
# 启动方式：--spring.profiles.active=datasource
#
# 宿主数据源由 DatasourceStoreConfig 提供（演示用 SQLite 文件库，business_shipment
# 与 lk_client_outbox 同库，OrderStatusService.updateStatusAtomically 的事务演示
# 完整）；生产替换为业务库连接。
linkora:
  # 传输加密（0.6.0 默认开启，与认证无关；两端 key 必须一致）
  payload-cipher-key: "Qr1J5BCqFYkIlxfELSx6xYoZZ5YxYEZyWHZrBOJT83M="
  client:
    store: datasource
