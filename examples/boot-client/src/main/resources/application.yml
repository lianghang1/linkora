server:
  port: 8083

spring:
  application:
    name: linkora-boot-client

linkora:
  # 本示例为客户端角色：显式关闭服务端装配
  # （0.5.0 起服务端默认 store=sqlite、不再依赖宿主 DataSource，client-only 宿主必须显式关闭）
  server:
    enabled: false
  client:
    # starter 自动装配开关：组装 LinkoraClient（启动/优雅关闭全部托管）
    enabled: true
    # 对端 boot-server（默认端口 8082）
    server-url: http://127.0.0.1:8082
    client-id: demo-client
    # 存储模式（0.5.0，与服务端对等）：
    #   sqlite（默认）——本地 SQLite 文件，离线缓冲优先；
    #   datasource   ——复用宿主 DataSource（业务消息同库同事务，transactional
    #                    outbox），启动方式：--spring.profiles.active=datasource
    # db-path: data/linkora-boot-client.db
