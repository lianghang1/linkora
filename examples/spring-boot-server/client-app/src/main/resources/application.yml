spring:
  application:
    name: linkora-boot-client
  # 纯客户端角色，不需要 web 容器
  main:
    web-application-type: none

linkora:
  client:
    # starter 自动装配开关：组装 LinkoraClient（启动/优雅关闭全部托管）
    enabled: true
    # 对端 server-app（examples/spring-boot-server/server-app，默认端口 8082）
    server-url: http://127.0.0.1:8082
    client-id: demo-client
    # SQLite 本地队列（WAL + synchronous=FULL）；换宿主业务库可自提供 ClientStore bean
    db-path: data/linkora-boot-client.db
