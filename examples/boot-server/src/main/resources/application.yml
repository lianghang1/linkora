server:
  port: 8082

spring:
  application:
    name: linkora-boot-server
  autoconfigure:
    # 内嵌 SQLite 模式无需宿主数据源（拆包后 spring-jdbc 随装配包传递，须防 Boot 误建 DataSource）
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

linkora:
  # 传输加密（0.6.0 默认开启，与认证无关；两端 key 必须一致）
  payload-cipher-key: "Qr1J5BCqFYkIlxfELSx6xYoZZ5YxYEZyWHZrBOJT83M="
  server:
    enabled: true
    # 存储模式（0.5.0，与服务端/客户端对等）：
    #   sqlite（默认）——内嵌 ./linkora/linkora-server.db，零配置起步，
    #                    适用于开发/演示/小规模部署；
    #   datasource   ——复用宿主 DataSource（业务消息同库同事务），生产推荐，
    #                    启动方式：--spring.profiles.active=datasource
    # 本文件即 sqlite 模式的全部配置；无需数据库连接。
    # db-path: ./linkora/linkora-server.db
    # 认证模式（0.6.0）：token = 委托宿主账号体系校验（HostTokenValidator）
    # 可选 hmac（默认）/ anonymous；详见 docs/security.md
    auth-mode: token
    # 启动时自动注册的演示客户端（幂等）
    register-clients:
      demo-client: true
    # 演示用：投递重试 2 次即进死信，便于快速演示管理接口的死信重放
    max-delivery-retries: 2
    retry-backoff-base-ms: 1000
    events-path: /events
    messages-path: /messages
    acks-path: /acks
