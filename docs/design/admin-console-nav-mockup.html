<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkora 控制台 · 导航方案对比稿</title>
<style>
:root{
  --bg:#0B0C12;--raised:rgba(255,255,255,.03);--raised-2:rgba(255,255,255,.06);
  --hair:rgba(255,255,255,.07);--hair-2:rgba(255,255,255,.13);
  --ink:#F2F3F7;--ink-2:#A6ACBB;--ink-3:#5D6370;
  --accent:#8B7CF8;--accent-2:#4CC3F7;
  --accent-grad:linear-gradient(135deg,#8B7CF8,#4CC3F7);
  --accent-tint:rgba(139,124,248,.10);
  --accent-border:rgba(139,124,248,.32);
  --ok:#34D399;--warn:#FBBF24;--bad:#FB6F6A;--mut:#7E8694;
  --glow-ok:0 0 9px rgba(52,211,153,.5);--glow-warn:0 0 9px rgba(251,191,36,.5);--glow-bad:0 0 9px rgba(251,111,106,.5);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
kbd{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--hair-2);background:rgba(255,255,255,.04);color:var(--ink-3)}

/* 设计稿切换器 */
.picker{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:flex;gap:4px;padding:5px;border-radius:14px;background:rgba(19,19,24,.92);backdrop-filter:blur(12px);border:1px solid var(--hair-2);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.picker button{padding:8px 16px;border-radius:10px;font-size:12.5px;color:var(--ink-2);transition:all .15s}
.picker button:hover{color:var(--ink)}
.picker button.on{background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent-border);color:#fff;font-weight:600}

/* ═══ 方案 A：悬浮胶囊导航（居中） ═══ */
.navA{display:none;align-items:center;height:64px;padding:0 28px;border-bottom:1px solid var(--hair);position:relative}
body[data-nav="A"] .navA{display:flex}
.navA .brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:9px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;color:#14102E;box-shadow:0 4px 18px rgba(139,124,248,.35)}
.brand b{font-size:15px;font-weight:650}
.pillnav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:4px;border-radius:99px;background:var(--raised);border:1px solid var(--hair)}
.pillnav a{display:flex;align-items:center;gap:7px;padding:7px 17px;border-radius:99px;font-size:13px;font-weight:500;color:var(--ink-2);transition:all .18s;cursor:pointer}
.pillnav a svg{width:14px;height:14px}
.pillnav a:hover{color:var(--ink)}
.pillnav a.on{background:var(--accent-grad);color:#14102E;font-weight:650;box-shadow:0 4px 14px rgba(139,124,248,.35)}
.pillnav a .badge{background:var(--bad);color:#fff;font-size:10px;padding:0 6px;border-radius:99px;font-weight:650;box-shadow:var(--glow-bad)}
.pillnav a .badge:empty{display:none}
.pillnav a.on .badge{background:#14102E;color:#fff;box-shadow:none}
.topright{margin-left:auto;display:flex;align-items:center;gap:12px}
.cswitch{display:flex;align-items:center;gap:9px;padding:6.5px 13px;border-radius:9px;border:1px solid var(--hair-2);background:rgba(255,255,255,.03);font-size:12.5px;color:var(--ink-2);cursor:pointer}
.cswitch b{color:var(--ink);font-weight:550}
.cswitch svg{width:12px;height:12px;color:var(--ink-3)}

/* ═══ 方案 B：左侧图标栏（hover 展开） ═══ */
.layoutB{display:none;height:100vh}
body[data-nav="B"] .layoutB{display:flex}
.rail{width:64px;flex:none;background:rgba(255,255,255,.015);border-right:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;transition:width .22s cubic-bezier(.3,.9,.3,1);overflow:hidden}
.rail:hover{width:208px;align-items:stretch;padding:14px 12px}
.rail .brand{display:flex;align-items:center;gap:10px;padding:0 0 16px;justify-content:center}
.rail .brand b{opacity:0;transition:opacity .15s;white-space:nowrap}
.rail:hover .brand b{opacity:1}
.rail .brand-mark{flex:none}
.ritem{display:flex;align-items:center;gap:11px;height:42px;border-radius:10px;color:var(--ink-2);font-size:13.5px;font-weight:500;cursor:pointer;position:relative;transition:all .15s;justify-content:center;padding:0}
.rail:hover .ritem{justify-content:flex-start;padding:0 12px}
.ritem svg{width:17px;height:17px;flex:none}
.ritem span{opacity:0;transition:opacity .15s;white-space:nowrap}
.rail:hover .ritem span{opacity:1}
.ritem:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.ritem.on{background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent-border);color:#fff}
.ritem.on svg{color:var(--accent);filter:drop-shadow(0 0 6px rgba(139,124,248,.55))}
.ritem .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;padding:0 6px;border-radius:99px;font-weight:650;box-shadow:var(--glow-bad);opacity:0}
.rail:hover .ritem .badge{opacity:1}
.ritem .badge:empty{display:none}
.rail .foot{margin-top:auto;font-size:10px;color:var(--ink-3);white-space:nowrap;opacity:0;transition:opacity .15s}
.rail:hover .foot{opacity:1}
.layoutB main{flex:1;min-width:0;overflow-y:auto;height:100vh}
.layoutB .topright{display:flex;justify-content:flex-end;gap:12px;padding:14px 28px}

/* ═══ 方案 C：顶栏分段胶囊（现布局精修） ═══ */
.navC{display:none;align-items:center;height:58px;padding:0 28px;border-bottom:1px solid var(--hair)}
body[data-nav="C"] .navC{display:flex}
.navC .brand{display:flex;align-items:center;gap:10px}
.segnav{margin-left:26px;display:flex;gap:3px;padding:3.5px;border-radius:11px;background:var(--raised);border:1px solid var(--hair)}
.segnav a{display:flex;align-items:center;gap:7px;padding:6.5px 15px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:all .15s}
.segnav a svg{width:13.5px;height:13.5px}
.segnav a:hover{color:var(--ink)}
.segnav a.on{background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent-border);color:#fff;font-weight:600}
.segnav a .badge{background:var(--bad);color:#fff;font-size:10px;padding:0 6px;border-radius:99px;font-weight:650;box-shadow:var(--glow-bad)}
.segnav a .badge:empty{display:none}

/* 页面内容（三种方案共用） */
.stage{display:none}
body[data-nav="A"] .stage.wrap,body[data-nav="C"] .stage.wrap{display:block;max-width:1240px;margin:0 auto;padding:32px}
body[data-nav="B"] .stage{display:block;padding:20px 32px 60px}
.page-head h1{font-size:27px;font-weight:680;letter-spacing:-.025em}
.page-head .desc{margin-top:5px;font-size:13.5px;color:var(--ink-2)}
.metrics{display:flex;margin:26px 0 30px}
.metric{padding:0 40px;border-left:1px solid var(--hair)}
.metric:first-child{padding-left:0;border-left:none}
.metric .m-lbl{font-size:11px;font-weight:550;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.metric .m-lbl i{width:6px;height:6px;border-radius:50%}
.metric .m-val{font-family:var(--mono);font-size:38px;font-weight:700;margin:6px 0 4px;background:linear-gradient(180deg,#fff,#9AA2B1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.metric .m-val small{font-size:16px;-webkit-text-fill-color:var(--ink-3);font-weight:450}
.metric .m-sub{font-size:11.5px;color:var(--ink-3)}
.sect-head{display:flex;align-items:baseline;gap:12px;margin:28px 0 4px}
.sect-head h2{font-size:16.5px;font-weight:650}
.sect-head .cnt{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.rows{border-top:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:14px;padding:15px 14px;border-bottom:1px solid var(--hair);border-radius:10px;transition:background .13s}
.row:hover{background:var(--raised)}
.r-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.r-ico svg{width:15px;height:15px}
.r-ico.bad{background:rgba(251,111,106,.1);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(251,111,106,.26)}
.r-ico.warn{background:rgba(251,191,36,.1);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(251,191,36,.24)}
.r-main{min-width:0;flex:1}
.r-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.r-title .mid{font-family:var(--mono);font-size:12.5px;font-weight:550}
.r-title .type{font-size:11px;color:var(--ink-2);background:var(--raised-2);padding:1.5px 8px;border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:7px;border:1px solid var(--hair-2);background:rgba(255,255,255,.03);font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.chip svg{width:10px;height:10px;color:var(--ink-3)}
.chip.block{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:var(--warn)}
.r-sub{margin-top:3px;font-size:12px;color:var(--ink-3);display:flex;gap:13px;flex-wrap:wrap}
.r-sub .mono{color:var(--ink-3)}
.r-time{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none}
.r-acts{display:flex;gap:7px;flex:none;opacity:0;transition:opacity .15s}
.row:hover .r-acts{opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:5.5px 12px;border-radius:7px;font-size:12px;font-weight:550;border:1px solid transparent;white-space:nowrap}
.btn-tint{background:rgba(139,124,248,.1);color:var(--accent);border-color:var(--accent-border)}
.btn-danger-tint{background:rgba(251,111,106,.1);color:var(--bad);border-color:rgba(251,111,106,.28)}
.btn-outline{border-color:var(--hair-2);color:var(--ink);background:rgba(255,255,255,.03)}
.duo{display:grid;grid-template-columns:1fr 350px;gap:56px;margin-top:34px}
.chartwrap h3,.feed h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:16px}
.feed{border-left:1px solid var(--hair);padding-left:30px}
.feed-item{position:relative;padding:0 0 20px 20px}
.feed-item::before{content:"";position:absolute;left:3px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.feed-item.ok::before{background:var(--ok);box-shadow:var(--glow-ok)}
.feed-item.bad::before{background:var(--bad);box-shadow:var(--glow-bad)}
.feed-item::after{content:"";position:absolute;left:5.5px;top:16px;bottom:-2px;width:1px;background:var(--hair)}
.feed-item:last-child::after{display:none}
.feed-item .f-t{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.feed-item .f-n{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.chartbox svg{width:100%;height:190px;display:block}
.chart-x{display:flex;justify-content:space-around;font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin-top:8px}
.hint{margin-top:34px;font-size:12px;color:var(--ink-3);background:var(--raised);border:1px dashed var(--hair-2);border-radius:10px;padding:10px 16px;line-height:1.7}
.hint b{color:var(--accent)}
</style>
</head>
